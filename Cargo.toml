[package]
name = "tryingopen2api"
version = "0.1.13"
edition = "2021"
description = "TryingOpen 免费模型 OpenAI/Anthropic 兼容 API 网关（Rust 版，代理池故障轮换）"
authors = ["lza6"]
license = "MIT"

[[bin]]
name = "tryingopen2api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "socks", "multipart", "cookies"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
regex = "1"
bytes = "1"
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# 本仓库网速不佳时用离线缓存；有网环境可移除
# [source.crates-io]
# replace-with = "vendored-sources"
# [source.vendored-sources]
# directory = "vendor"


