# TryingOpen2API 容器编排（生产示例）
#
# 安全默认：config.example.json 的 listen_addr 为 127.0.0.1（本机绑定，避免照抄示例
# 即公网开放）。本 compose 通过环境变量 LISTEN_ADDR=0.0.0.0:47831 在容器内覆盖回
# 所有网卡监听，配合下方 ports 映射由宿主机端口暴露并为容器内 healthcheck 可达。
#
# !!! 生产部署硬性检查 !!!
#  - 对外暴露到公网前，必须设置 UI_PASSWORD 或 API_KEYS，否则网关注入器/面板匿名可访问；
#    可在此 environment 下增加，如：
#      API_KEYS: "sk-your-key-1,sk-your-key-2"
#      UI_PASSWORD: "change-me"
#  - 有防火墙/安全组时，仅放行本机或可信来源访问 47831 端口。

name: tryingopen2api

services:
  tryingopen2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tryingopen2api:latest
    container_name: tryingopen2api
    ports:
      - "47831:47831"
    volumes:
      # 配置只读挂载（宿主机 config.json -> 容器 /app/config.json）
      - ./config.json:/app/config.json:ro
      # 数据持久化（proxies.txt；会话为内存态），可改名 ./data 为任意宿主机目录
      - ./data:/app/data
    environment:
      # 日志级别；更多覆盖项见 docs/DOCKER.md 环境变量表
      RUST_LOG: info
      # 容器内监听到 0.0.0.0（覆盖 config 的 127.0.0.1 安全默认），使端口映射可达
      LISTEN_ADDR: 0.0.0.0:47831
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/47831 && printf \"GET /healthz HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
