# TryingOpen2API — CD：main push 后自动部署到 Azure 服务器
#
# 依赖 Secret（GitHub repo Settings -> Secrets and variables -> Actions）：
#   SSH_HOST = 20.204.27.154
#   SSH_USER = root
#   SSH_PASS = <root password>
#
# 安全设计：
#   - 服务器端 nice -n 10 编译（低优先级，避免占满内存卡死 sshd）
#   - 部署脚本独立文件 .github/scripts/deploy.sh（避免 workflow 内嵌引号问题）
#   - 用 BUILD_PID 判断编译完成（不依赖 pgrep 全局匹配）

name: CD-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: cd-deploy
  cancel-in-progress: false  # 防取消导致 systemd 停在停止态

jobs:
  deploy:
    name: deploy (aarch64 + systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install paramiko
        run: pip install --quiet paramiko

      - name: Package source
        shell: bash
        run: |
          tar --exclude='./target' --exclude='./.git' --exclude='./data/proxies.txt' \
              -czf tryingopen2api_src.tar.gz Cargo.toml Cargo.lock src
          ls -la tryingopen2api_src.tar.gz

      - name: Deploy via SSH (build on server)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          python3 <<'PYEOF'
          import paramiko, os, sys
          host = os.environ["SSH_HOST"]; user = os.environ["SSH_USER"]; pwd = os.environ["SSH_PASS"]
          c = paramiko.SSHClient()
          c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect(host, port=22, username=user, password=pwd, timeout=20, banner_timeout=20, auth_timeout=20)
          sftp = c.open_sftp()
          sftp.put("tryingopen2api_src.tar.gz", "/root/tryingopen2api_src.tar.gz")
          sftp.put(".github/scripts/deploy.sh", "/root/cd_deploy.sh")
          sftp.close()
          print("[uploaded source + script]")
          stdin, stdout, stderr = c.exec_command("bash /root/cd_deploy.sh", timeout=950)
          out = stdout.read().decode("utf-8", "replace")
          err = stderr.read().decode("utf-8", "replace")
          rc = stdout.channel.recv_exit_status()
          print(out[-3000:])
          if err.strip(): print("[stderr]", err[-2000:])
          c.close()
          if rc != 0:
              sys.exit(1)
          print("CD_DEPLOY_JOB_OK")
          PYEOF

      - name: Verify public healthz
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          sleep 3
          curl -sS -m 15 "http://${SSH_HOST}:47831/healthz" | head -c 300
          echo ""
          echo "CD_VERIFY_DONE"
